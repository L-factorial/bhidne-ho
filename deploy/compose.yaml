name: bhidne-ho-test
services:
  backend:
    build:
      context: ..
      dockerfile: Dockerfile
      target: backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:8080"
    environment:
      BHIDNE_CORS_ORIGINS: https://bhidne-ho.lfactorial.com
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
