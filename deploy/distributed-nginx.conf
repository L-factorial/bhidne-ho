# Included in nginx's http context. Integration only; upstreams use the dedicated dataset.
map $http_upgrade $distributed_connection {
    default upgrade;
    '' close;
}
upstream distributed_gateways {
    least_conn;
    server gateway_a:8080 max_fails=1 fail_timeout=5s;
    server gateway_b:8080 max_fails=1 fail_timeout=5s;
}
server {
    listen 8080;
    client_max_body_size 64k;
    location / {
        proxy_pass http://distributed_gateways;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $distributed_connection;
        proxy_buffering off;
        proxy_connect_timeout 2s;
        proxy_read_timeout 75s;
        proxy_send_timeout 15s;
        # Retrying a mutation is the durable client's job with its original ID.
        proxy_next_upstream off;
    }
}
