# Opt-in local PostgreSQL. The default compose.yaml deliberately remains in-memory
# so existing deployments do not require database secrets or infrastructure.
services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: bhidne_ho
      POSTGRES_USER: bhidne_ho
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bhidne_ho -d bhidne_ho"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    environment:
      DATABASE_URL: postgresql://bhidne_ho:${POSTGRES_PASSWORD}@postgres:5432/bhidne_ho
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
