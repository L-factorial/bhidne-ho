[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bhidne-ho"
version = "0.1.0"
description = "In-memory multiplayer foundation for Bhidne Ho"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2,<3", "uvicorn[standard]>=0.34,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "httpx>=0.28,<1", "websockets>=14,<17"]

[tool.setuptools.packages.find]
include = ["app*", "card_utils*", "callbreak*", "marriage*", "flush*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.package-data]
app = ["test_ui/*.html", "test_ui/*.css", "test_ui/*.js"]
